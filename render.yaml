# Render Blueprint — eSCORE saytini 3 servisda joylashtirish.
# Render dashboard → "New +" → "Blueprint" → repozitoriyni ulang → bu fayl avtomatik o'qiladi.
services:
  # 1) FastAPI — SofaScore proksisi (Python, curl_cffi anti-bot)
  - type: web
    name: escore-api
    runtime: python
    rootDir: sofascore-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  # 2) Node backend (Express) — frontend shu yerga murojaat qiladi
  - type: web
    name: escore-backend
    runtime: node
    rootDir: escore/server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      # FastAPI manzili (to'liq URL — fromService faqat nom berib qo'yadi, shuning uchun qo'lda)
      - key: SCORE_API
        value: https://escore-api.onrender.com

  # 3) Frontend (Vite/React statik) — DOMEN SHU SERVISGA ULANADI
  - type: web
    name: escore-web
    runtime: static
    rootDir: escore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Node backend manzili build paytida o'rnatiladi (to'liq URL — qo'lda)
      - key: VITE_API_URL
        value: https://escore-backend.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
